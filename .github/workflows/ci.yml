name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxe
        run: python -m py_compile data_quest_8bit.py versao_terminal/data_quest.py
      - name: Rodar simulação do jogo (sem janela)
        run: python tests/test_simulacao.py
